<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>遮词 · 背单词</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f1e8; --ink:#211d17; --ink2:#7a7163; --line:#e4dccd;
  --card:#fffdf7; --red:#b8402f; --green:#2c6e54;
  --shadow:0 12px 30px -14px rgba(70,52,20,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141210; --ink:#efe8db; --ink2:#9c9282; --line:#332d25;
    --card:#262119; --red:#d4685a; --green:#5aa886;
    --shadow:0 12px 30px -14px rgba(0,0,0,.85);
  }
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.app{position:relative;height:100vh;height:100dvh;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;user-select:none;-webkit-user-select:none}
.view.on{display:flex}

/* ---------- 通用 ---------- */
.hd{display:flex;align-items:center;gap:6px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;flex:none}
.hd-t{flex:1;font-size:15px;font-weight:600;letter-spacing:.02em}
.hd-t.center{text-align:center}
.icon{width:40px;height:40px;border:none;background:transparent;color:var(--ink2);font-size:22px;line-height:1;display:grid;place-items:center;border-radius:12px;flex:none}
.icon:active{background:rgba(128,110,80,.12)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(28px + env(safe-area-inset-bottom))}
.sec-t{margin:24px 2px 10px;font-size:12px;letter-spacing:.16em;color:var(--ink2)}
.empty{padding:34px 6px;color:var(--ink2);font-size:14px;text-align:center;line-height:1.8}

/* ---------- 首页 ---------- */
.hero{padding:22px 2px 18px}
.hero-num{font-family:Georgia,"Times New Roman",serif;font-size:60px;line-height:1;letter-spacing:-2px}
.hero-lbl{margin-top:10px;color:var(--ink2);font-size:13px}
.hero-lbl b{color:var(--ink);font-weight:600}
.resume{display:flex;align-items:center;width:100%;gap:10px;padding:15px 16px;border-radius:16px;border:none;background:var(--ink);color:var(--bg);margin-bottom:14px;text-align:left}
.resume b{font-size:15px;font-weight:600}
.resume span{margin-left:auto;font-size:12.5px;opacity:.72}
.opt{display:flex;align-items:center;gap:13px;width:100%;padding:15px;border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:10px;text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.opt:active{transform:scale(.986)}
.opt-i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--bg);font-size:16px;color:var(--ink2);flex:none}
.opt-b{flex:1;min-width:0}
.opt-b b{display:block;font-size:15.5px;font-weight:600}
.opt-b i{display:block;font-style:normal;font-size:12.5px;color:var(--ink2);margin-top:3px}
.opt-a{color:var(--ink2);font-size:20px;flex:none;opacity:.7}
.row{display:flex;align-items:center;width:100%;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left}
.row:active{transform:scale(.99)}
.row b{font-size:15px;font-weight:600}
.row i{font-style:normal;font-size:12.5px;color:var(--ink2);margin-left:9px}
.row-a{margin-left:auto;color:var(--ink2);font-size:13px}
.foot-note{margin:26px 2px 0;font-size:12px;color:var(--ink2);opacity:.8;line-height:1.7}

/* ---------- 背诵 ---------- */
.top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 4px;flex:none}
.top-t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12.5px;color:var(--ink2);letter-spacing:.03em;white-space:nowrap;pointer-events:none}
.top-r{display:flex;align-items:center;gap:2px}
.tx{border:none;background:transparent;color:var(--ink2);font-size:12.5px;padding:0 6px;height:40px;border-radius:10px;letter-spacing:.02em}
.tx:active{background:rgba(128,110,80,.12)}
.bar{height:2px;background:var(--line);margin:4px 18px 0;border-radius:2px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .28s ease}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:6px 98px 0 18px;overflow-y:auto}
.wordarea{flex:none;display:flex;flex-direction:column;align-items:center;padding:0 0 52px}
.wordwrap{width:100%;overflow:hidden;display:flex;justify-content:center}
.word{font-family:Georgia,"Times New Roman","Songti SC",serif;font-size:54px;line-height:1.12;letter-spacing:-.6px;white-space:nowrap}
.ph{margin-top:11px;height:17px;font-size:13.5px;color:var(--ink2);letter-spacing:.02em}
.paperwrap{flex:none;padding:0 2px 2px}
.paper{
  position:relative;width:100%;min-height:170px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  transform:rotate(-.45deg);display:flex;align-items:center;justify-content:center;
  padding:26px 22px;transition:transform .18s ease,border-color .18s ease;
}
.paper:active{transform:rotate(-.45deg) scale(.992)}
.paper::after{
  content:"";position:absolute;top:-8px;left:50%;width:56px;height:15px;margin-left:-28px;
  background:rgba(202,180,132,.5);border-radius:2px;transform:rotate(-2deg);
  box-shadow:0 1px 2px rgba(0,0,0,.05);pointer-events:none;
}
.paper.missed{border-color:rgba(184,64,47,.38)}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:13px;background:var(--card);color:var(--ink2);font-size:13.5px;letter-spacing:.18em;transition:opacity .2s ease,transform .2s ease}
.cover span{opacity:.62}
.paper.rev .cover{opacity:0;transform:translateY(-8px);pointer-events:none}
.mean{font-size:21px;line-height:1.62;text-align:center;opacity:0;transform:translateY(7px);transition:opacity .24s ease,transform .24s ease}
.paper.rev .mean{opacity:1;transform:none}
.hint{height:20px;margin-top:9px;font-size:12px;color:var(--ink2);text-align:center;letter-spacing:.03em;flex:none}
.foot-r{margin-left:auto;padding-bottom:4px;text-align:right;color:var(--ink2);font-size:12px;line-height:1.7}
.foot-r.rd{color:var(--red)}
.rail{position:absolute;right:10px;top:58%;transform:translateY(-50%);width:76px;display:flex;flex-direction:column;gap:10px;z-index:3}
.btn{width:100%;border-radius:15px;border:none;transition:transform .08s ease,opacity .15s ease}
.btn:active{transform:scale(.96)}
.btn.miss{height:58px;background:var(--card);border:1.5px solid var(--red);color:var(--red);font-size:16px;font-weight:600;letter-spacing:.06em;box-shadow:0 8px 20px -14px rgba(40,25,10,.7)}
.btn.miss[disabled]{opacity:.4;border-color:var(--line);color:var(--ink2);box-shadow:none}
.btn.next{height:66px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:700;letter-spacing:.04em;box-shadow:0 12px 26px -14px rgba(0,0,0,.6)}
.btn.prev{height:40px;background:transparent;border:1px solid var(--line);color:var(--ink2);font-size:12.5px;letter-spacing:.02em;border-radius:12px;box-shadow:none}
.btn.prev:active{background:rgba(128,110,80,.1)}
.paper.instant .cover,.paper.instant .mean{transition:none!important}
.opt-a.num{font-size:12.5px;letter-spacing:.02em;opacity:.9}
.rail-cap{margin-top:1px;text-align:center;font-size:11px;line-height:14px;min-height:14px;color:var(--red);letter-spacing:.02em}

/* ---------- 结算 ---------- */
.stat3{display:flex;gap:9px;margin:14px 0 4px}
.stat3 > div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat3 b{display:block;font-family:Georgia,serif;font-size:26px;line-height:1.1}
.stat3 i{display:block;font-style:normal;font-size:11.5px;color:var(--ink2);margin-top:4px}
.stat3 .rd{color:var(--red)}
.mrow{display:flex;align-items:baseline;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.mrow b{font-family:Georgia,serif;font-size:16.5px;font-weight:600;flex:none;max-width:46%}
.mrow span{color:var(--ink2);font-size:13px;line-height:1.5;flex:1;text-align:right}
.mrow .cnt{font-style:normal;font-size:11px;color:var(--red);background:rgba(184,64,47,.09);border-radius:6px;padding:2px 6px;margin-left:8px;flex:none}
.x{width:26px;height:26px;border:none;background:transparent;color:var(--ink2);font-size:15px;flex:none;opacity:.55}
.bottom{flex:none;display:flex;flex-direction:column;gap:9px;padding:12px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.abtn{width:100%;height:52px;border-radius:14px;border:1px solid transparent;font-size:16px;font-weight:600;transition:transform .08s ease}
.abtn:active{transform:scale(.985)}
.abtn.pri{background:var(--ink);color:var(--bg)}
.abtn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
.abtn.txt{background:transparent;color:var(--ink2);height:40px;font-weight:400;font-size:14px}
.abtn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.abtn[disabled]{opacity:.4}

/* ---------- 设置 ---------- */
.seg{display:flex;gap:8px;margin-bottom:6px}
.seg button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tip{margin:0 2px 10px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.tip code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
textarea{width:100%;height:150px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;line-height:1.7;resize:vertical;margin-bottom:12px;user-select:text;-webkit-user-select:text}

.jump{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.jump input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;user-select:text;-webkit-user-select:text}
.jump button{width:118px;flex:none;height:48px}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;z-index:200;visibility:hidden;opacity:0;transition:opacity .2s ease,visibility 0s .26s}
.modal.on{visibility:visible;opacity:1;transition:opacity .2s ease,visibility 0s}
.modal-mask{position:absolute;inset:0;background:rgba(20,15,8,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:24px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.18)}
.modal.on .sheet{transform:none}
.sheet-t{font-size:17px;font-weight:700;margin-bottom:8px;letter-spacing:.01em}
.sheet-b{font-size:13.5px;color:var(--ink2);line-height:1.75;white-space:pre-line;margin-bottom:20px}
.sheet-a{display:flex;flex-direction:column;gap:9px}

/* ---------- toast ---------- */.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(28,24,18,.93);color:#f5f1e8;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:99;max-width:82vw;text-align:center;line-height:1.4}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <!-- ================= 首页 ================= -->
  <section class="view on" id="v-home">
    <div class="hd">
      <div class="hd-t">遮词</div>
      <button class="icon" id="btn-set" aria-label="设置">⚙</button>
    </div>
    <div class="scroll">
      <div class="hero">
        <div class="hero-num" id="h-total">0</div>
        <div class="hero-lbl">个词 · 错题 <b id="h-wrong">0</b> · 今日已背 <b id="h-today">0</b></div>
      </div>
      <button class="opt" id="btn-order">
        <span class="opt-i">↓</span>
        <span class="opt-b"><b>顺序背诵</b></span>
        <span class="opt-a" id="order-st">›</span>
      </button>
      <button class="opt" id="btn-shuffle">
        <span class="opt-i">⤨</span>
        <span class="opt-b"><b>全书乱序一遍</b></span>
        <span class="opt-a" id="shuffle-st">›</span>
      </button>
      <button class="opt" id="btn-wrong-mode">
        <span class="opt-i">✗</span>
        <span class="opt-b"><b>错题本复习</b></span>
        <span class="opt-a" id="wrong-st">›</span>
      </button>
      <div class="foot-note">进度自动存在这台设备上，关掉也不会丢。</div>
    </div>
  </section>

  <!-- ================= 背诵 ================= -->
  <section class="view" id="v-study">
    <div class="top">
      <button class="icon" id="btn-back" aria-label="返回">‹</button>
      <div class="top-t" id="s-title">顺序 · 1/2050</div>
      <div class="top-r">
        <button class="tx" id="btn-reset">重置</button>
      </div>
    </div>
    <div class="bar"><i id="s-bar"></i></div>
    <div class="stage">
      <div class="wordarea">
        <div class="wordwrap"><div class="word" id="s-word">abandon</div></div>
        <div class="ph" id="s-ph"></div>
      </div>
      <div class="paperwrap">
        <div class="paper" id="paper">
          <div class="cover"><span>轻点掀开</span></div>
          <div class="mean" id="mean"></div>
        </div>
      </div>
      <div class="hint" id="s-hint"></div>
    </div>
    <div class="rail">
      <button class="btn prev" id="btn-prev">↩ 上一个</button>
      <button class="btn miss" id="btn-miss">不会</button>
      <button class="btn next" id="btn-next">会了</button>
      <div class="rail-cap" id="s-count"></div>
    </div>
  </section>

  <!-- ================= 结算 ================= -->
  <section class="view" id="v-result">
    <div class="hd">
      <button class="icon" id="r-home" aria-label="返回">‹</button>
      <div class="hd-t center" id="r-title">本轮结束</div>
      <div style="width:40px;flex:none"></div>
    </div>
    <div class="scroll">
      <div class="stat3">
        <div><b id="r-total">0</b><i>本轮词数</i></div>
        <div><b id="r-known">0</b><i>会了</i></div>
        <div><b id="r-miss" class="rd">0</b><i>不会</i></div>
      </div>
      <div class="sec-t">本轮不会的词</div>
      <div id="r-list"></div>
    </div>
    <div class="bottom" id="r-actions"></div>
  </section>

  <!-- ================= 错题本 ================= -->
  <section class="view" id="v-wrong">
    <div class="hd">
      <button class="icon" id="w-back" aria-label="返回">‹</button>
      <div class="hd-t center">错题本 <span id="w-count" style="color:var(--ink2);font-weight:400">0</span></div>
      <button class="tx" id="w-clear">清空</button>
    </div>
    <div class="scroll"><div id="w-list"></div></div>
    <div class="bottom"><button class="abtn pri" id="w-start">开始复习</button></div>
  </section>

  <!-- ================= 设置 ================= -->
  <section class="view" id="v-set">
    <div class="hd">
      <button class="icon" id="set-back" aria-label="返回">‹</button>
      <div class="hd-t center">设置</div>
      <div style="width:40px;flex:none"></div>
    </div>
    <div class="scroll">
      <div class="sec-t">起始位置</div>
      <p class="tip">想从第几个词开始背，就在这里改（比如你背到 500，就填 501）。改完从「顺序背诵」进去。</p>
      <div class="jump">
        <input id="jump" type="number" min="1" inputmode="numeric" placeholder="第几个">
        <button class="abtn sec" id="jump-btn">跳到这里</button>
      </div>
      <div class="sec-t">替换词库</div>
      <p class="tip">每行一个词：<code>abandon 放弃；抛弃</code>　也支持从 Excel 直接粘贴（单词和释义之间用 Tab）。</p>
      <textarea id="imp" placeholder="abandon&#9;放弃；抛弃&#10;ability&#9;能力&#10;&#10;也可以直接：abandon 放弃；抛弃"></textarea>
      <button class="abtn pri" id="imp-btn">导入并替换词库</button>
      <div class="sec-t">备份 / 换设备</div>
      <p class="tip">换网址或换手机时，先导出备份，到新地址粘贴恢复。词库不用管，只有进度和错题。</p>
      <textarea id="bak" placeholder="点「导出备份」会生成一串文本，复制保存好（可以发给自己）"></textarea>
      <button class="abtn pri" id="bak-exp">导出备份</button>
      <div style="height:9px"></div>
      <button class="abtn sec" id="bak-imp">从备份恢复</button>
      <div class="sec-t">其他</div>
      <button class="abtn danger" id="reset-btn">清空全部进度（含错题本）</button>
    </div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-mask" id="m-mask"></div>
  <div class="sheet">
    <div class="sheet-t" id="m-title"></div>
    <div class="sheet-b" id="m-body"></div>
    <div class="sheet-a" id="m-acts"></div>
  </div>
</div>

<script>
/* ==========================================================
   词库：把你的单词贴到 DEMO 里即可（或页面里 设置 → 替换词库）
   每行一个：{w:'单词', ph:'音标(可省)', m:'中文释义'}
   ========================================================== */
const DEMO = [
  {w:"for",m:"为了……、对于……、因为"},
  {w:"change",m:"改变、零钱"},
  {w:"take",m:"拿走、携带"},
  {w:"care",m:"关心、在意"},
  {w:"in",m:"在……内"},
  {w:"look",m:"看"},
  {w:"promise",m:"承诺、保证"},
  {w:"decide",m:"决定"},
  {w:"make",m:"制作、使得"},
  {w:"on",m:"在……上、继续着"},
  {w:"courage",m:"勇气"},
  {w:"hope",m:"希望"},
  {w:"interest",m:"兴趣、利益"},
  {w:"surprise",m:"惊讶、使感到意外"},
  {w:"work",m:"工作、作品、奏效"},
  {w:"expect",m:"预料、期待"},
  {w:"disappoint",m:"使失望"},
  {w:"plan",m:"计划"},
  {w:"with",m:"伴随"},
  {w:"believe",m:"相信、认为"},
  {w:"leave",m:"离开、把……留下"},
  {w:"so",m:"因此"},
  {w:"proud",m:"骄傲的"},
  {w:"accept",m:"接受"},
  {w:"find",m:"发现"},
  {w:"realize",m:"意识到、实现"},
  {w:"show",m:"展示、展现"},
  {w:"since",m:"自从、因为、既然"},
  {w:"act",m:"行为、行动、扮演"},
  {w:"agree",m:"同意"},
  {w:"as",m:"作为、如同、随着、因为"},
  {w:"regret",m:"遗憾、后悔"},
  {w:"though",m:"尽管、虽然"},
  {w:"think",m:"认为"},
  {w:"until",m:"直到"},
  {w:"chance",m:"机会、可能性"},
  {w:"experience",m:"经历、经验"},
  {w:"hold",m:"握着、坚持、举办"},
  {w:"if",m:"如果、是否"},
  {w:"notice",m:"注意、通知"},
  {w:"patience",m:"耐心"},
  {w:"curious",m:"好奇的"},
  {w:"give",m:"给"},
  {w:"remember",m:"记得"},
  {w:"satisfied",m:"满意的、满足的"},
  {w:"but",m:"但是"},
  {w:"confident",m:"自信的"},
  {w:"discover",m:"探索、发现"},
  {w:"imagine",m:"想象"},
  {w:"or",m:"或者、否则"},
  {w:"time",m:"时间、次数"},
  {w:"even",m:"甚至"},
  {w:"suggest",m:"建议、表明"},
  {w:"anxious",m:"焦虑的"},

/* ==========================================================
   初始进度（等你的词表 / 进度 / 错题后我填这里）
   orderFrom: 从头数第几个词开始背（0 基，12 表示前 12 个已背过）
   wrong: 你手动记下来的错题（会直接进错题本）
   ========================================================== */
const SEED = { version:'v3', orderFrom:561, wrong:['appointment', 'attempt', 'guilty', 'view', 'raise', 'settle', 'upset', 'condition', 'sight', 'commitment', 'complete', 'figure', 'mark', 'match', 'desperate'] };

/* ================= 状态 ================= */
const LSKEY = 'ciyu.state.v1';
const DECKKEY = 'ciyu.deck.v1';
const DECK_VERSION = 'deck-2';
const $ = s => document.querySelector(s);

let WORDS = DEMO.slice();
let BY = {};
function rebuild(){ BY = {}; WORDS.forEach(x => { BY[x.w] = x; }); }
try {
  const d = JSON.parse(localStorage.getItem(DECKKEY) || 'null');
  if (d && d.v === DECK_VERSION && Array.isArray(d.words) && d.words.length >= 3 && d.words.every(x => x && x.w && x.m)) WORDS = d.words;
} catch (e) {}
rebuild();

function defaultState(){ return { records:{}, sessions:{}, days:{}, seedVersion:'', orderFrom:0 }; }
let S = (function(){
  try {
    const o = JSON.parse(localStorage.getItem(LSKEY) || 'null');
    if (o && typeof o === 'object') {
      return { records:o.records||{}, sessions:o.sessions||{}, days:o.days||{}, seedVersion:o.seedVersion||'', orderFrom:o.orderFrom||0 };
    }
  } catch (e) {}
  return defaultState();
})();
function save(){ try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) {} }

let cur = null, revealed = false, last = null, curMode = null;
const hists = { order:[], shuffle:[], wrong:[], custom:[] };

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function bumpToday(){ const k = todayKey(); S.days[k] = (S.days[k]||0) + 1; }
function rec(w){ let r = S.records[w]; if (!r) { r = S.records[w] = { miss:0, streak:0, known:false }; } return r; }
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function vibrate(ms){ if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

let toastTimer = null;
function toast(msg){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('on'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

function groups(){
  const n = Math.max(5, Math.min(100, S.groupSize || 30));
  const out = [];
  for (let i = 0; i < WORDS.length; i += n) out.push(WORDS.slice(i, i+n).map(x => x.w));
  return out;
}
function wrongList(){
  return WORDS.map(x => x.w).filter(w => { const r = S.records[w]; return r && r.miss > 0 && !r.known; });
}
function titleFor(s){
  if (s.mode === 'group') return '第 ' + (s.g+1) + ' 组';
  if (s.mode === 'order') return '顺序';
  if (s.mode === 'shuffle') return '全书乱序';
  if (s.mode === 'wrong') return '错题本';
  return '重刷';
}

/* ================= 路由 ================= */
function route(name){
  ['home','study','result','wrong','set'].forEach(v => {
    const el = document.getElementById('v-' + v);
    if (el) el.classList.toggle('on', v === name);
  });
}

/* ================= 首页 ================= */
function setSt(sel, txt, num){
  const el = $(sel);
  if (!el) return;
  el.textContent = txt;
  el.classList.toggle('num', !!num);
}

function posText(s){
  const p = progressOf(s);
  return (p.cur + 1) + '/' + p.total;
}

function renderHome(){
  const wl = wrongList();
  $('#h-total').textContent = WORDS.length;
  $('#h-wrong').textContent = wl.length;
  $('#h-today').textContent = S.days[todayKey()] || 0;

  const so = S.sessions.order, ss = S.sessions.shuffle, sw = S.sessions.wrong;
  setSt('#order-st', so ? posText(so) : '›', !!so);
  setSt('#shuffle-st', ss ? posText(ss) : '›', !!ss);
  setSt('#wrong-st', sw ? posText(sw) : (wl.length ? String(wl.length) : '›'), !!(sw || wl.length));

  route('home');
}
function goHome(){ renderHome(); }

/* ================= 开始一轮 ================= */
function start(mode, opt){
  opt = opt || {};
  let list = [], base = 0;
  if (mode === 'order') { base = Math.max(0, Math.min(WORDS.length - 1, S.orderFrom || 0)); list = WORDS.slice(base).map(x => x.w); }
  else if (mode === 'shuffle') { list = shuffle(WORDS.map(x => x.w)); }
  else if (mode === 'wrong') { list = shuffle(wrongList()); }
  else if (mode === 'custom') { list = (opt.list || []).slice(); }
  list = list.filter(w => BY[w]);
  if (!list.length) { toast(mode === 'wrong' ? '错题本是空的' : '没有可背的词'); return; }

  S.sessions[mode] = { mode:mode, base:base, list:list, pos:0, known:0, missed:[], results:{}, t:Date.now() };
  hists[mode] = [];
  save();
  openSession(mode);
}

function openSession(mode){
  const s = S.sessions[mode];
  if (!s) { goHome(); return; }
  curMode = mode;
  if (s.pos >= s.list.length) { finish(); return; }
  cur = BY[s.list[s.pos]];
  if (!cur) { s.pos++; save(); openSession(mode); return; }
  route('study');
  paintCard();
}

/* ================= 背诵 ================= */
function progressOf(s){
  if (s.mode === 'order') return { cur:(s.base||0) + s.pos, total:WORDS.length };
  return { cur:s.pos, total:s.list.length };
}

function paintCard(){
  const s = S.sessions[curMode];
  if (!s || !cur) return;
  const p = progressOf(s);
  const paper = $('#paper');
  paper.classList.add('instant');
  setRev(false);
  $('#s-word').textContent = cur.w;
  $('#s-ph').textContent = cur.ph || '';
  $('#mean').textContent = cur.m;
  $('#s-bar').style.width = (p.cur / p.total * 100) + '%';
  fitWord();
  paintBtns();
  requestAnimationFrame(() => requestAnimationFrame(() => paper.classList.remove('instant')));
}

function paintBtns(){
  const s = S.sessions[curMode];
  if (!s || !cur) return;
  const marked = s.results[cur.w] === 'm';
  const m = $('#btn-miss'), n = $('#btn-next');
  m.disabled = marked;
  m.textContent = marked ? '已记录' : '不会';
  n.textContent = marked ? '下一个' : '会了';
  $('#s-hint').textContent = marked ? '已记入错题本，看一眼释义，点「下一个」继续' : '';
  $('#paper').classList.toggle('missed', marked);
  const p = progressOf(s);
  $('#s-title').textContent = titleFor(s) + ' · ' + (p.cur+1) + '/' + p.total;
  $('#s-count').textContent = s.missed.length ? ('不会 ' + s.missed.length) : '';
}

function setRev(v){
  revealed = v;
  $('#paper').classList.toggle('rev', v);
}

function fitWord(){
  const el = $('#s-word'), wrap = el.parentElement;
  el.style.fontSize = '';
  if (wrap.clientWidth < 60) return;
  let size = parseFloat(getComputedStyle(el).fontSize);
  let guard = 0;
  while (el.scrollWidth > wrap.clientWidth - 4 && size > 19 && guard++ < 80) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
}

function pushHist(){
  const s = S.sessions[curMode];
  if (!s) return;
  const h = hists[curMode] || (hists[curMode] = []);
  h.push({
    w:cur.w, pos:s.pos,
    st:(cur.w in s.results) ? s.results[cur.w] : null,
    known:s.known,
    missed:s.missed.slice(),
    rec:Object.assign({}, rec(cur.w))
  });
  if (h.length > 60) h.shift();
}

function onMiss(){
  const s = S.sessions[curMode];
  if (!s || !cur) return;
  if (s.results[cur.w] === 'm') return;
  pushHist();
  s.results[cur.w] = 'm';
  s.missed.push(cur.w);
  const r = rec(cur.w);
  r.miss = (r.miss||0) + 1;
  r.streak = 0;
  r.known = false;
  bumpToday();
  setRev(true);
  paintBtns();
  save();
  vibrate(20);
}

function onKnow(){
  const s = S.sessions[curMode];
  if (!s || !cur) return;
  const alreadyMissed = s.results[cur.w] === 'm';
  if (!alreadyMissed) {
    pushHist();
    s.results[cur.w] = 'k';
    s.known++;
    const r = rec(cur.w);
    r.streak = (r.streak||0) + 1;
    if (r.miss > 0 && r.streak >= 2 && !r.known) {
      r.known = true;
      toast('「' + cur.w + '」连续答对 2 次，已移出错题本');
    }
    bumpToday();
  }
  s.pos++;
  if (s.mode === 'order') S.orderFrom = Math.min(WORDS.length, (s.base||0) + s.pos);
  save();
  if (s.pos >= s.list.length) { finish(); return; }
  cur = BY[s.list[s.pos]];
  if (!cur) { finish(); return; }
  paintCard();
}

function onUndo(){
  const s = S.sessions[curMode];
  const h = hists[curMode] || [];
  const item = h.pop();
  if (!item) { toast(s && s.pos > 0 ? '前面没有可以回退的记录了' : '已经是第一个了'); return; }
  if (!s) { goHome(); return; }
  S.records[item.w] = Object.assign({}, item.rec);
  if (item.st === null) delete s.results[item.w]; else s.results[item.w] = item.st;
  s.known = item.known;
  s.missed = item.missed;
  s.pos = item.pos;
  if (s.mode === 'order') S.orderFrom = Math.min(WORDS.length, (s.base||0) + s.pos);
  cur = BY[item.w] || cur;
  save();
  route('study');
  paintCard();
  vibrate(8);
}

function finish(){
  const s = S.sessions[curMode];
  if (!s) { goHome(); return; }
  last = s;
  delete S.sessions[curMode];
  hists[curMode] = [];
  save();
  renderResult();
  route('result');
}

/* ================= 结算 ================= */
function renderResult(){
  const s = last;
  if (!s) { goHome(); return; }
  $('#r-title').textContent = titleFor(s) + ' · 完成';
  $('#r-total').textContent = s.list.length;
  $('#r-known').textContent = s.known;
  $('#r-miss').textContent = s.missed.length;

  const box = $('#r-list');
  box.innerHTML = '';
  if (!s.missed.length) {
    box.innerHTML = '<div class="empty">这一轮全部会了，一个都没漏。</div>';
  } else {
    s.missed.forEach(w => {
      const o = BY[w] || { w:w, m:'' };
      const d = document.createElement('div');
      d.className = 'mrow';
      const b = document.createElement('b');
      b.textContent = o.w;
      const sp = document.createElement('span');
      sp.textContent = o.m;
      d.appendChild(b); d.appendChild(sp);
      box.appendChild(d);
    });
  }

  const acts = $('#r-actions');
  acts.innerHTML = '';
  const add = (label, fn, cls) => {
    const b = document.createElement('button');
    b.className = 'abtn ' + (cls || 'pri');
    b.textContent = label;
    b.onclick = fn;
    acts.appendChild(b);
  };
  if (s.missed.length) {
    add('只刷这 ' + s.missed.length + ' 个', () => start('custom', { list:s.missed }), 'pri');
  }
  if (s.mode === 'shuffle') add('换一副牌再来一遍', () => start('shuffle'), 'sec');
  else if (s.mode === 'order') add('从头再来一遍', () => { S.orderFrom = 0; save(); start('order'); }, 'sec');
  else if (s.mode === 'wrong') add('再复习一遍', () => start('wrong'), 'sec');
  else if (s.mode === 'custom') add('再刷一遍', () => start('custom', { list:s.list }), 'sec');
  add('回首页', goHome, 'txt');
}

/* ================= 错题本 ================= */
function openWrong(){
  const list = wrongList();
  $('#w-count').textContent = list.length;
  const box = $('#w-list');
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="empty">错题本是空的。<br>背的时候点「不会」，词会自动进来。</div>';
  } else {
    list.forEach(w => {
      const r = S.records[w] || {};
      const o = BY[w] || { w:w, m:'' };
      const d = document.createElement('div');
      d.className = 'mrow';
      const b = document.createElement('b');
      b.textContent = o.w;
      const sp = document.createElement('span');
      sp.textContent = o.m;
      const cnt = document.createElement('em');
      cnt.className = 'cnt';
      cnt.textContent = '错 ' + (r.miss||0);
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = '×';
      x.onclick = () => {
        if (confirm('把「' + w + '」移出错题本？')) {
          r.known = true;
          r.streak = 2;
          save();
          openWrong();
        }
      };
      d.appendChild(b); d.appendChild(sp); d.appendChild(cnt); d.appendChild(x);
      box.appendChild(d);
    });
  }
  const btn = $('#w-start');
  btn.disabled = !list.length;
  btn.textContent = list.length ? ('开始复习 · ' + list.length + ' 词（乱序）') : '暂无可复习的词';
  route('wrong');
}

/* ================= 设置 ================= */
function openSet(){
  const j = $('#jump');
  if (j) j.value = String((S.orderFrom || 0) + 1);
  route('set');
}

function jumpTo(){
  let n = parseInt(($('#jump').value || '').trim(), 10);
  if (!n || n < 1) { toast('先输入一个数字'); return; }
  n = Math.min(n, WORDS.length);
  S.orderFrom = n - 1;
  S.sessions = {};
  hists.order = []; hists.shuffle = []; hists.wrong = []; hists.custom = [];

function openReset(){
  const inStudy = document.getElementById('v-study').classList.contains('on');
  const s = (inStudy && curMode) ? S.sessions[curMode] : null;
  const inRound = !!(s && s.list && s.pos < s.list.length);
  const n = wrongList().length;
  openModal({
    title: inRound ? '结束本轮并清空错题本？' : '清空错题本？',
    body: (inRound ? titleFor(s) + ' · ' + (s.pos+1) + '/' + s.list.length + '\n本轮进度不会保留。\n\n' : '') +
          '错题本里的 ' + n + ' 个词会全部清空，无法恢复。',
    actions: [
      { label:'清空并结束', cls:'danger', fn: doReset },
      { label:'取消', cls:'txt', fn: closeModal }
    ]
  });

function doReset(){
  const inStudy = document.getElementById('v-study').classList.contains('on');
  if (inStudy && curMode) { delete S.sessions[curMode]; hists[curMode] = []; }
  S.records = {};
  save();
  closeModal();
  goHome();
  toast(inStudy ? '本轮已结束，错题本已清空' : '错题本已清空');
}

function applySeed(){
  if (!SEED || S.seedVersion === SEED.version) return;
  S.seedVersion = SEED.version;
  if (SEED.orderFrom > 0) {
    S.orderFrom = Math.min(WORDS.length, SEED.orderFrom);
    delete S.sessions.order;
  }
  (SEED.wrong || []).forEach(w => {
    const key = String(w).trim();
    if (!BY[key]) return;
    const r = rec(key);
    r.miss = Math.max(1, r.miss || 0);
    r.streak = 0;
    r.known = false;
  });
  save();
}

function parseDeck(text){
  const out = [];
  text.split(/\r?\n/).forEach(raw => {
    let line = raw.replace(/\u00a0/g, ' ').replace(/^\s*\d+[\.、\)）]\s*/, '').trim();
    if (!line) return;
    if (/^[#\/]{1,2}/.test(line)) return;
    let w = '', ph = '', m = '';
    if (line.indexOf('\t') >= 0) {
      const p = line.split('\t').map(x => x.trim()).filter(Boolean);
      if (p.length >= 2) {
        w = p[0];
        let rest = p.slice(1);
        if (rest.length > 1 && /^[\/\[].*[\/\]]$/.test(rest[0])) { ph = rest.shift(); }
        m = rest.join('；');
      }
    }
    if (!w || !m) {
      const mm = line.match(/^([A-Za-z][A-Za-z'’\-\.]*)\s*(\/[^\/]+\/|\[[^\]]+\])?\s+(.+)$/);
      if (mm) { w = mm[1]; ph = mm[2] || ''; m = mm[3]; }
    }
    if (w && m) out.push({ w:w.replace(/[\.\s]+$/, ''), ph:ph, m:m.trim() });
  });
  return out;
}

  WORDS = arr;
  rebuild();
  try { localStorage.setItem(DECKKEY, JSON.stringify({ v:DECK_VERSION, words:WORDS })); } catch (e) {}
  S.sessions = {};
  hists.order = []; hists.shuffle = []; hists.wrong = []; hists.custom = [];

$('#bak-imp').onclick = () => {
  try {
    const o = JSON.parse(($('#bak').value || '').trim());
    if (!o || typeof o !== 'object' || !o.records) throw new Error('bad');
    S.records = o.records;
    S.orderFrom = o.orderFrom || 0;
    S.days = o.days || {};
    S.sessions = {};
    hists.order = []; hists.shuffle = []; hists.wrong = []; hists.custom = [];
    save();
    $('#bak').value = '';
    toast('已恢复备份');
    goHome();
  } catch (e) {
    toast('备份内容不对，检查一下是否复制完整');
  }
};

$('#reset-btn').onclick = () => {
  openModal({
    title: '清空全部数据？',
    body: '进度、错题本、今日统计全部清空，词库保留。',
    actions: [
      { label:'全部清空', cls:'danger', fn: () => {
          const d = defaultState();
          d.seedVersion = SEED.version;
          S = d;
          hists.order = []; hists.shuffle = []; hists.wrong = []; hists.custom = [];
          save();
          closeModal();
          toast('已清空全部数据');
          goHome();
        } },
      { label:'取消', cls:'txt', fn: closeModal }
    ]
  });
};

/* 启动 */
applySeed();
$('#s-word').style.fontSize = '';
renderHome();
route('home');
</script>
</body>
</html>
